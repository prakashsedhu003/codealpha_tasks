<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef2f9">
  <title>Create post · ConnectSphere</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%232563EB'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='white' stroke-width='2.4'/%3E%3Ccircle cx='23' cy='9' r='2.6' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">
  <!-- Runs before the page paints so the saved theme never flashes -->
  <script src="js/theme.js"></script>
</head>
<body data-page="create">
  <a class="skip-link" href="#main">Skip to main content</a>
  <div class="app-shell no-rail">
    <aside class="sidebar" id="sidebar" aria-label="Sidebar"></aside>
    <div class="app-center">
      <header class="topbar" id="topbar"></header>
      <main class="page" id="main" tabindex="-1">
        <h1 class="view-title">Create post</h1>
        <form class="composer-card" id="postForm" novalidate>
          <div class="composer-user" id="composerUser"></div>
          <div class="form-alert" id="postAlert" role="alert" hidden></div>
          <button class="btn btn-outline btn-sm" type="button" id="localPreviewBtn" hidden>Preview in feed (this device only, not saved)</button>
          <div class="field">
            <label class="field-label" for="content">Caption</label>
            <textarea class="input textarea" id="content" name="content" rows="5" placeholder="What's on your mind?"></textarea>
            <div class="counter-row"><span id="charCount">0 / 1000</span></div>
          </div>
          <div class="field">
            <label class="field-label" for="image_url">Image link <span class="field-hint">(optional)</span></label>
            <input class="input" id="image_url" name="image_url" type="url" inputmode="url" autocomplete="off" placeholder="https://images.unsplash.com/photo-…">
            <p class="field-hint">Paste a link to an image. Uploading files is not supported yet.</p>
            <p class="field-error" id="imageError" hidden></p>
          </div>
          <div class="image-preview" id="imagePreview" hidden></div>
          <div class="composer-actions">
            <button class="btn btn-ghost" type="button" id="cancelPost">Cancel</button>
            <button class="btn btn-primary" type="submit">Post</button>
          </div>
        </form>
      </main>
    </div>

  </div>
  <nav class="bottom-nav" id="bottomNav" aria-label="Mobile navigation"></nav>
  <div class="toast-root" id="toast-root" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/posts.js"></script>
</body>
</html>
