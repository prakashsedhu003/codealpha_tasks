<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef2f9">
  <title>Profile · ConnectSphere</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%232563EB'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='white' stroke-width='2.4'/%3E%3Ccircle cx='23' cy='9' r='2.6' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/profile.css">
  <link rel="stylesheet" href="css/responsive.css">
  <!-- Runs before the page paints so the saved theme never flashes -->
  <script src="js/theme.js"></script>
</head>
<body data-page="profile">
  <a class="skip-link" href="#main">Skip to main content</a>
  <div class="app-shell is-wide">
    <aside class="sidebar" id="sidebar" aria-label="Sidebar"></aside>
    <div class="app-center">
      <header class="topbar" id="topbar"></header>
      <main class="page" id="main" tabindex="-1">
        <div class="stack" id="profileRoot">
          <div class="stack" id="profileNotes" hidden></div>
          <section class="profile-card" id="profileHeader" aria-label="Profile"></section>
          <h2 class="profile-section-title">Posts</h2>
          <ul class="post-grid" id="postGrid"></ul>
        </div>
      </main>
    </div>

  </div>
  <nav class="bottom-nav" id="bottomNav" aria-label="Mobile navigation"></nav>
  <div class="toast-root" id="toast-root" aria-live="polite"></div>
  <dialog class="dialog" id="editDialog" aria-labelledby="editTitle">
    <form class="dialog-form" id="editForm" novalidate>
      <h2 class="dialog-title" id="editTitle">Edit profile</h2>
      <div class="form-alert" id="editError" role="alert" hidden></div>
      <div class="field"><label class="field-label" for="editName">Full name</label>
        <input class="input" id="editName" name="full_name" type="text" maxlength="60" autocomplete="name"></div>
      <div class="field"><label class="field-label" for="editBio">Bio</label>
        <textarea class="input textarea" id="editBio" name="bio" rows="3" maxlength="160" style="min-height:84px"></textarea></div>
      <div class="field"><label class="field-label" for="editAvatar">Profile photo link <span class="field-hint">(optional)</span></label>
        <input class="input" id="editAvatar" name="avatar_url" type="url" placeholder="https://…" autocomplete="off"></div>
      <div class="dialog-actions">
        <button class="btn btn-ghost" type="button" data-cancel>Cancel</button>
        <button class="btn btn-primary" type="submit">Save changes</button>
      </div>
    </form>
  </dialog>
  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sample-data.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/posts.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
