<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef2f9">
  <title>Log in · ConnectSphere</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%232563EB'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='white' stroke-width='2.4'/%3E%3Ccircle cx='23' cy='9' r='2.6' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
  <!-- Runs before the page paints so the saved theme never flashes -->
  <script src="js/theme.js"></script>
</head>
<body data-page="login" class="auth-body">
  <div class="auth-layout">
    <section class="auth-brand">
      <a class="brand" href="login.html" aria-label="ConnectSphere">
        <svg viewBox="0 0 32 32" width="36" height="36" aria-hidden="true" focusable="false"><rect width="32" height="32" rx="10" fill="#fff"/><circle cx="16" cy="16" r="7" fill="none" stroke="#2563EB" stroke-width="2.4"/><circle cx="23" cy="9" r="2.6" fill="#2563EB"/></svg>
        <span class="brand-name">ConnectSphere</span>
      </a>
      <div>
        <h2>Stay close to the people who matter.</h2>
        <p>Share moments, follow friends and keep up with what they are building, cooking and exploring.</p>
      </div>
      <div class="auth-brand-art" aria-hidden="true">
        <span class="avatar">JC</span><span class="avatar">PD</span><span class="avatar">AK</span><span class="avatar">SL</span>
        <span class="count">Join the conversation</span>
      </div>
    </section>
    <main class="auth-panel" id="main">
      <button class="icon-btn auth-theme" type="button" data-theme-toggle aria-label="Switch theme">
        <i class="fa-solid fa-moon icon-moon" aria-hidden="true"></i><i class="fa-solid fa-sun icon-sun" aria-hidden="true"></i>
      </button>
      <div class="auth-card">
        <a class="brand" href="login.html" aria-label="ConnectSphere">
          <svg viewBox="0 0 32 32" width="32" height="32" aria-hidden="true" focusable="false"><rect width="32" height="32" rx="10" fill="#2563EB"/><circle cx="16" cy="16" r="7" fill="none" stroke="#fff" stroke-width="2.4"/><circle cx="23" cy="9" r="2.6" fill="#fff"/></svg>
          <span class="brand-name">ConnectSphere</span>
        </a>
        <div><h1>Welcome back</h1><p class="auth-sub">Log in to continue to ConnectSphere.</p></div>
        <p class="notice" id="pageNotice" role="status" hidden></p>
        <form class="auth-form" id="loginForm" novalidate>
          <div class="form-alert" role="alert" hidden></div>
          <div class="field">
            <label class="field-label" for="email">Email</label>
            <input class="input" id="email" name="email" type="email" autocomplete="email" aria-describedby="email-error" required inputmode="email">
            <p class="field-error" id="email-error" hidden></p>
          </div>
          <div class="field">
            <label class="field-label" for="password">Password</label>
            <div class="input-wrap">
              <input class="input" id="password" name="password" type="password" autocomplete="current-password" aria-describedby="password-error" required>
              <button class="toggle-pw" type="button" data-toggle-password="password" aria-label="Show password" aria-pressed="false"><i class="fa-regular fa-eye" aria-hidden="true"></i></button>
            </div>
            <p class="field-error" id="password-error" hidden></p>
          </div>
          <button class="btn btn-primary btn-block" type="submit">Log in</button>
        </form>
        <p class="auth-alt">New here? <a href="register.html">Create an account</a></p>
      </div>
    </main>
  </div>
  <div class="toast-root" id="toast-root" aria-live="polite"></div>
  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
</body>
</html>
