<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef2f9">
  <title>Notifications · ConnectSphere</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%232563EB'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='white' stroke-width='2.4'/%3E%3Ccircle cx='23' cy='9' r='2.6' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">
  <!-- Runs before the page paints so the saved theme never flashes -->
  <script src="js/theme.js"></script>
</head>
<body data-page="notifications">
  <a class="skip-link" href="#main">Skip to main content</a>
  <div class="app-shell no-rail">
    <aside class="sidebar" id="sidebar" aria-label="Sidebar"></aside>
    <div class="app-center">
      <header class="topbar" id="topbar"></header>
      <main class="page" id="main" tabindex="-1">
        <div class="page-head">
          <div><h1>Notifications</h1><p id="notifSummary" aria-live="polite"></p></div>
          <button class="btn btn-outline btn-sm" type="button" id="markAll" disabled>Mark all as read</button>
        </div>
        <div class="tabs" role="tablist" aria-label="Filter notifications">
          <button class="tab is-active" type="button" role="tab" aria-selected="true" data-filter="all">All</button>
          <button class="tab" type="button" role="tab" aria-selected="false" data-filter="unread">Unread</button>
        </div>
        <div class="notice notice-demo" id="demoBanner" role="status" hidden>
          <i class="fa-solid fa-flask" aria-hidden="true"></i>
          <span><strong>Sample notifications.</strong> The backend has no <code>GET /api/notifications</code> route yet. Nothing here is saved.</span>
        </div>
        <ul class="notif-list" id="notifList" aria-live="polite"></ul>
      </main>
    </div>

  </div>
  <nav class="bottom-nav" id="bottomNav" aria-label="Mobile navigation"></nav>
  <div class="toast-root" id="toast-root" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sample-data.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/notifications.js"></script>
</body>
</html>
